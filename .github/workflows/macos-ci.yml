name: Protected macOS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select validation by change impact
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      app: ${{ steps.plan.outputs.app }}
      ui: ${{ steps.plan.outputs.ui }}
      migrations: ${{ steps.plan.outputs.migrations }}
      website: ${{ steps.plan.outputs.website }}
      benchmarks: ${{ steps.plan.outputs.benchmarks }}
      release: ${{ steps.plan.outputs.release }}
      governance: ${{ steps.plan.outputs.governance }}
      claims: ${{ steps.plan.outputs.claims }}
      entitlements: ${{ steps.plan.outputs.entitlements }}
      publication_metadata: ${{ steps.plan.outputs.publicationMetadata }}
    steps:
      - name: Checkout history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed files and compute validation plan
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          bash Scripts/verify-changed-files.sh "${BASE_SHA:-}" HEAD
          plan="$(bash Scripts/ci-change-plan.sh "${BASE_SHA:-}" HEAD)"
          jq -r 'to_entries[] | "\(.key)=\(.value | if type == "array" then tojson else tostring end)"' <<<"$plan" >> "$GITHUB_OUTPUT"
          jq . <<<"$plan"

  inventory:
    name: Changed CI governance
    if: needs.plan.outputs.governance == 'true'
    needs: plan
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test CI policy and repository structure
        run: |
          bash Tests/Scripts/test-ci-change-plan.sh
          bash Tests/Scripts/test-verify-changed-files.sh
          bash Tests/Scripts/test-macos-ci-gates.sh
          bash Tests/Scripts/test-verify-product-claims.sh
          bash Tests/Scripts/test-headless-probe-glue.sh
          bash Scripts/verify-repo-facts.sh

  claims:
    name: Changed product claims
    if: needs.plan.outputs.claims == 'true'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify affected claims
        run: bash Scripts/verify-product-claims.sh

  swift-packages:
    name: Affected Swift packages
    if: needs.plan.outputs.packages != '[]'
    needs: plan
    runs-on: macos-15
    env:
      PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test affected packages on one runner
        run: |
          jq -r '.[]' <<<"$PACKAGES" | while IFS= read -r package; do
            bash Scripts/test-all-packages.sh "$package"
          done

  app-build:
    name: Relevant Release app and XPC build
    if: needs.plan.outputs.app == 'true'
    needs: plan
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build release app and embedded XPC
        run: bash Scripts/build-macos-app.sh Release
      - name: Verify changed signing boundaries
        if: needs.plan.outputs.entitlements == 'true'
        run: bash Scripts/verify-entitlements.sh

  app-smoke:
    name: Focused app UI and hosted XPC smoke
    if: needs.plan.outputs.ui == 'true'
    needs: plan
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Run focused UI and hosted XPC smoke
        run: bash Scripts/run-app-smoke-tests.sh

  migration-fixtures:
    name: Changed migration fixtures
    if: needs.plan.outputs.migrations == 'true'
    needs: plan
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Upgrade supported shipping fixtures
        run: bash Scripts/run-shipping-migration-fixtures.sh

  document-benchmarks:
    name: Changed document benchmark gates
    if: needs.plan.outputs.benchmarks == 'true'
    needs: plan
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify deterministic and performance baselines
        run: |
          bash Scripts/run-benchmarks.sh --verify-baseline
          bash Scripts/run-benchmarks.sh --performance

  website:
    name: Changed website and published metadata
    if: needs.plan.outputs.website == 'true'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install publication metadata XML tooling
        if: needs.plan.outputs.publication_metadata == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxml2-utils
      - name: Validate publication metadata only
        if: needs.plan.outputs.publication_metadata == 'true'
        run: |
          xmllint --noout website/public/appcast.xml
          bash Scripts/verify-release-version-state.sh
      - name: Setup Node
        if: needs.plan.outputs.publication_metadata != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Run website checks
        if: needs.plan.outputs.publication_metadata != 'true'
        run: bash Scripts/test-website.sh

  release-controls:
    name: Changed release controls
    if: needs.plan.outputs.release == 'true'
    needs: plan
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test release orchestration and transaction
        run: |
          bash Tests/Scripts/test-cut-release.sh
          bash Tests/Scripts/test-release-dispatch.sh
          bash Tests/Scripts/test-release-preflight.sh
          bash Tests/Scripts/test-release-transaction.sh
          bash Scripts/verify-release-protection.sh

  required:
    name: Protected macOS CI
    if: always()
    needs: [plan, inventory, claims, swift-packages, app-build, app-smoke, migration-fixtures, document-benchmarks, website, release-controls]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS"
