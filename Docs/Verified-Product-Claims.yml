    topic: "store-exhaustive-v072-proof-integrity"
    wording: "Store v072 admits an export-eligible v2 exact-slice proof only when every succeeded checkpoint has coherent terminal attempt history, valid ordered row timestamps, and a typed findings array whose findings each cite at least one primary or contrary reference anchored to that checkpoint's own exact partition slice; optional quote and slice-relative range fields fail closed when malformed or outside that slice. Exact publication also requires the attached source set's independent frozen-corpus hash to equal the Store recomputation over the run's canonical membership and slices. While its matter exists, Store prevents drift of the exact source-set attachment/mode/hash, linked version identity/content/verification, parent matter/type, single-run ownership, and proof-linked export-eligible active selection."
