  - id: "PERMANENT-SOURCE-DELETION-INTEGRITY"
    topic: "permanent-source-deletion"
    wording: "Permanent document deletion rejects attachment graphs that cross a matter boundary, then removes the selected same-matter attachment subtree and its revision and index graph in one Store transaction. It clears live source identities while retaining saved output content, citation display excerpts and locators, and corpus-analysis proof records such as evidence quotes and document names; document classifications and relations are removed, connected or no-longer-verifiable same-matter output versions and corpus-analysis runs become stale, provably unrelated work remains unchanged, affected active outputs move to needs review, and the base deletion audit is written in that transaction. CorpusAnalysisRepository resume, finalize, and cancel lifecycle operations cannot restore assurance to a stale corpus run; a new run is required. Permanent matter deletion applies the same matter-boundary check and writes an FK-safe base audit in its cascade transaction; that database cascade removes in-app export records. Managed blob-file cleanup is post-commit and best-effort; prior audit history and previously written export files are not deleted by these Store operations."
    owner: "Persistence and document reliability engineering"
    code_anchor: "Packages/SupraStore/Sources/SupraStore/Repositories/DocumentLibraryRepository.swift"
    verification: "Packages/SupraStore/Tests/SupraStoreTests/PermanentDeletionBoundaryIntegrityTests.swift"
    ci_job: "macos-ci/swift-packages"
    applicable_version: "Next release after 2.3.4"
    last_reviewed: "2026-08-07"
    publication_anchor: "ARCHITECTURE.md"

