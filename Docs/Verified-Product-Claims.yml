    topic: "case-file-review-workflow"
    wording: "The Review workbench derives project progress and All / Needs review / Edited / Evidence attention filters from the selected project's current durable rows without changing stored review, value, support, or evidence state; selecting or opening another Review Project while a value edit is dirty requires the user to keep editing or explicitly discard that draft. If a requested switch or open fails after the user confirms discard, the same in-memory draft remains available to resume in the unchanged project. At the supported minimum window width, the Sources panel leaves project progress visible and the compact filter visible and usable. Presentation filters never narrow a Review snapshot, and any dirty value draft blocks export."
